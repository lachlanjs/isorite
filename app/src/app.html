<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- resizes-content: on Android the on-screen keyboard shrinks the page, so the header stays in view while typing. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>isorite</title>
<meta name="theme-color" content="#07101C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F0EA" media="(prefers-color-scheme: light)">
<!-- Added to the Home Screen, isorite opens on its own, without the browser's bars (W1): Lachlan uses it so. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="isorite">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307101C'/%3E%3Cpath d='M16 5l11 11l-11 11l-11-11z' fill='%23F0BE4A'/%3E%3C/svg%3E">
<script>
  // The ground chosen, before first paint: lapis, quartz, or the system's.
  (function () {
    try {
      var g = localStorage.getItem("isorite.ground");
      if (g === "lapis" || g === "quartz") document.documentElement.dataset.ground = g;
    } catch (e) { /* storage unavailable: the system's */ }
  })();
</script>
<script>
  // Served from a folder (the tutorial, on GitHub Pages at /isorite/), links come out as /isorite#/…: the folder
  // without its slash, which the router takes for another page, and reloads. Without it here too, they are this page.
  if (location.pathname.length > 1 && location.pathname.endsWith("/")) history.replaceState(history.state, "", location.pathname.slice(0, -1) + location.search + location.hash);
</script>
%sveltekit.head%
</head>
<body>
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
