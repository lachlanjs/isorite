<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- resizes-content: on Android the on-screen keyboard shrinks the page, so the header stays in view while typing. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>isorite</title>
<meta name="theme-color" content="#07101C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#F2F0EA" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307101C'/%3E%3Cpath d='M16 5l11 11l-11 11l-11-11z' fill='%23F0BE4A'/%3E%3C/svg%3E">
<script>
  // The ground chosen, before first paint: lapis, quartz, or the system's.
  (function () {
    try {
      var g = localStorage.getItem("isorite.ground");
      if (g === "lapis" || g === "quartz") document.documentElement.dataset.ground = g;
    } catch (e) { /* storage unavailable: the system's */ }
  })();
</script>
%sveltekit.head%
</head>
<body>
<div style="display: contents">%sveltekit.body%</div>
</body>
</html>
